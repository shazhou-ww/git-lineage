name: Bug report
description: Report a reproducible problem with git-lineage
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets or security vulnerabilities here; use the private reporting link instead.
  - type: input
    id: version
    attributes:
      label: git-lineage version
      description: Output of `git-lineage --version`
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and Git version
      placeholder: Windows 11, Node.js 22.13.0, Git 2.51.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description:
        Provide the smallest sequence of commands or repository setup that
        reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description:
        Include complete error output after removing credentials and other
        sensitive data.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other relevant details or a minimal repository link.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
