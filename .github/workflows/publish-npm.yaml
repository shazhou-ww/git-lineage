name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified tag
    if: github.repository == 'shazhou-ww/git-lineage'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install the trusted publishing client
        run: npm install --global npm@11.21.0

      - name: Verify release tag
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync } = require("node:fs");
          const packageJson = require("./package.json");
          const stableVersion = /^\d+\.\d+\.\d+$/u;
          const expectedTag = `v${packageJson.version}`;

          if (!stableVersion.test(packageJson.version)) {
            console.error(
              `::error::Automated publishing accepts stable SemVer versions only; received ${packageJson.version}.`,
            );
            process.exit(1);
          }

          if (
            process.env.RELEASE_EVENT === "push" &&
            process.env.RELEASE_TAG !== expectedTag
          ) {
            console.error(
              `::error::Tag ${process.env.RELEASE_TAG} does not match package version ${expectedTag}.`,
            );
            process.exit(1);
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `name=${packageJson.name}\nversion=${packageJson.version}\n`,
          );
          NODE
        id: release

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Reject an existing npm version
        if: github.event_name == 'push'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm check

      - name: Publish package
        if: github.event_name == 'push'
        run:
          npm publish --access public --tag latest
          --registry=https://registry.npmjs.org/ --loglevel=verbose

      - name: Validate trusted publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm pkg set "version=0.0.0-oidc-dry-run.${GITHUB_RUN_ID}"
          npm publish --dry-run --access public --tag oidc-dry-run --registry=https://registry.npmjs.org/ --loglevel=verbose
